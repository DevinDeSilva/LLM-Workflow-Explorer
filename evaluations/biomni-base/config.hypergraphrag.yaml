application:
  description: The application that utilizes a functional approach to support unittesting of LLMs on user designed prompts.
               This application contains functions generated by LLMs and functions that utilizes LLM generated output within
               the system. In this experiments are represented as provone:Executions of provone:Programs (a step of the experiment
               pipeline) while some of these provone:Programs are generated by LLM as Generative_Tasks. dc:identifier represents
               the unique experiment id.

file_paths:
  schema_loc: "schema/schemaV2.json"
  execution_kg_loc: "usecases/chatbs/data/1_sample_graph/chatbs_sample.ttl"
  metadata_loc: "usecases/chatbs/data/1_sample_graph/chatbs_sample_metadata.json"
  ontology_path: "schema/WorkFlow.ttl"

explainer_config:
  llm_type: "lmstudio"
  embedding_type: "lmstudio"
  vectordb_type: "hypergraphrag"
  save_answer_loc: "evaluations/biomni-base/explainer/hypergraphrag"

  llm_config:
    model: "openai/gpt-oss-20b"
    base_url: "http://localhost:1234/v1"
    temperature: 0
    max_tokens: 800

  embedding_config:
    model: "text-embedding-bge-large-en-v1.5"
    base_url: "http://localhost:1234/v1"

  object_search_config:
    hypergraphrag_working_dir: "evaluations/biomni-base/explainer/hypergraphrag/index"
    force_index_from_scratch: "false"
    embedding_dim: 1024
    embedding_max_token_size: 8192
    embedding_batch_num: 16
    embedding_func_max_async: 4
    llm_model_max_async: 4
    llm_model_max_token_size: 32768
    enable_llm_cache: "false"
    top_k: 20
    response_type: "Single Paragraph"
    max_token_for_text_unit: 4000
    max_token_for_global_context: 4000
    max_token_for_local_context: 4000
    max_literal_chars: 800
    chunk_token_size: 1200
    chunk_overlap_token_size: 100

  log_file: "evaluations/biomni-base/explainer/explainer_hypergraphrag_log.txt"

gt:
  log_file: "evaluations/biomni-base/ground_truth/ground_truth_log.txt"
  save_loc: "evaluations/biomni-base/ground_truth/ground_truth_data.jsonl"

