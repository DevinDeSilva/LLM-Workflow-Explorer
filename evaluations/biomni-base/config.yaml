application:
  description: |
    The Biomni application is an LLM-driven biomedical agent that plans, reasons,
    executes generated code, and optionally critiques intermediate answers to solve
    user-provided biomedical tasks. The provenance captures the user input, system
    prompt generation, each agent generation iteration, code execution, execution
    observations, final solution, and optional critic feedback as intermediary
    states of the agent run.
    Agent stages are represented as provone:Executions of provone:Programs,
    including user input recording, system prompt generation, LLM response
    generation, generated code execution, and critic review. LLM usage within the
    agent is represented as workflow:Generative_Task activity using
    workflow:Large_Language_Models. Generated responses, executable code,
    observations, critic feedback, and final solutions are connected across the
    workflow using provone:Channel and prov:wasInformedBy relations.
    dcterms:identifier represents the unique identifier for each recorded agent
    stage or experiment step.

file_paths:
  schema_loc: "schema/schemaV2.json"
  execution_kg_loc: "usecases/biomni/data/task3/biomni_sample.ttl"
  metadata_loc: "usecases/biomni/data/task3/biomni_sample_metadata.json"
  ontology_path: "schema/WorkFlow.ttl"

explorer_config:
  kg_name: "Biomni-Task3"
  ontology_triples_path: "schema/extracted_ontology_triples.csv"
  parallel: True
  temp_folder: "evaluations/biomni-base/exeprog_creation/tmp/programs"
  use_cache: False
  entity_length: 5
  explorer_metadata_loc: "evaluations/biomni-base/exeprog_creation/exeplorer_metadata.pkl"
  exeprog_save_loc: "evaluations/biomni-base/exeprog_creation/exeplored_programs.pkl"
  log_file: "evaluations/biomni-base/exeprog_creation/explorer_log.txt"

question_creation_config:
  save_questions: "evaluations/biomni-base/ques_creation/SyntheticQuestionKG.csv"
  log_file: "evaluations/biomni-base/ques_creation/question_creation_log.txt"
  llm_type: "lmstudio"
  llm_config:
    model: "openai/gpt-oss-20b"
    base_url: "http://localhost:1234/v1"

explainer_config:
  llm_type: "lmstudio"
  embedding_type: "lmstudio"
  vectordb_type: "milvus"
  save_answer_loc: "evaluations/biomni-base/explainer/results"

  llm_config:
    model: "openai/gpt-oss-20b"
    base_url: "http://localhost:1234/v1"

  vectordb_config:
    vector_dim: 1024
    collection_name: "biomni"

  embedding_config:
    model: "text-embedding-bge-large-en-v1.5"

  object_search_config:
    search_limit: 3
  log_file: "evaluations/biomni-base/explainer/explainer_log.txt"

gt:
  log_file: "evaluations/biomni-base/ground_truth/ground_truth_log.txt"
  save_loc: "evaluations/biomni-base/ground_truth/ground_truth_data.jsonl"

